name: Backup Diário — CRM EUREKA

# Backup do CRM EUREKA (crmeureka.tucanoverde.com, projeto Supabase kibkldlvialhxwobkoko).
# Roda neste repositorio apenas para reutilizar MAIL_USERNAME/MAIL_PASSWORD (senha de app do Gmail).
# Secrets proprios (prefixo CRMEUREKA_) — nunca os SUPABASE_* do CRM Redesa.
# Os dados vao para o repositorio PRIVADO tucanoverde/crmeureka-backups via deploy key.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 02:00 Brasília (o GitHub atrasa; na prática sai pela manhã cedo)   # 06:30 UTC = 03:30 Brasília (o backup do Redesa roda às 06:00)
  workflow_dispatch:

permissions:
  contents: read

env:
  TENANT: crmeureka
  TENANT_LABEL: "CRM EUREKA (crmeureka.tucanoverde.com)"
  REF_ESPERADO: kibkldlvialhxwobkoko

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: pip install requests

      - name: Data do backup
        run: echo "BACKUP_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Exportar backup do Supabase (CRM EUREKA)
        env:
          SUPABASE_URL: ${{ secrets.CRMEUREKA_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.CRMEUREKA_SUPABASE_SERVICE_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, sys, hashlib
          url = os.environ['SUPABASE_URL']; key = os.environ['SUPABASE_SERVICE_KEY']
          assert os.environ['REF_ESPERADO'] in url, 'CRMEUREKA_SUPABASE_URL nao e o projeto crmeureka - abortando (anticontaminacao)'
          headers = {'apikey': key, 'Authorization': f'Bearer {key}'}
          tabelas = ['municipios','municipios_historico','pipeline_tracking','indicadores_externos',
                     'perfis','fontes_dados','reuniao_semanal','configuracoes','atividades','colecoes','anexos']
          data = os.environ['BACKUP_DATE']; pasta = f'backups/{data}'
          os.makedirs(pasta, exist_ok=True)
          resumo = []
          manifest = {'tenant': os.environ['TENANT'], 'label': os.environ['TENANT_LABEL'],
                      'project_ref': os.environ['REF_ESPERADO'], 'data': data, 'tabelas': {}}
          for t in tabelas:
              rows, offset, limit = [], 0, 1000
              while True:
                  r = requests.get(f'{url}/rest/v1/{t}', headers={**headers, 'Range': f'{offset}-{offset+limit-1}'},
                                   params={'select': '*'}, timeout=120)
                  if r.status_code not in (200, 206):
                      print(f'ERRO {r.status_code} em {t}: {r.text[:200]}'); sys.exit(1)
                  chunk = r.json()
                  if not chunk: break
                  rows.extend(chunk)
                  if len(chunk) < limit: break
                  offset += limit
              path = f'{pasta}/{t}.json'
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(rows, f, ensure_ascii=False, indent=2, default=str)
              sha = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              manifest['tabelas'][t] = {'linhas': len(rows), 'bytes': os.path.getsize(path), 'sha256': sha}
              resumo.append(f'- {t}: {len(rows)} registros')
              print(f'  {t}: {len(rows)} registros')
              if t == 'municipios' and len(rows) < 5500:
                  print(f'ERRO: municipios com {len(rows)} registros (esperado ~5.568) - abortando.'); sys.exit(1)
          with open(f'{pasta}/_resumo.txt', 'w', encoding='utf-8') as f:
              f.write(f"Backup {os.environ['TENANT_LABEL']} — {data}\n\n" + '\n'.join(resumo) + f'\n\nTotal de tabelas: {len(tabelas)}\n')
          with open(f'{pasta}/_manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print('Backup completo:', data)
          PYEOF

      - name: Check diário — backup x banco vivo (9 tabelas)
        env:
          SUPABASE_URL: ${{ secrets.CRMEUREKA_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.CRMEUREKA_SUPABASE_SERVICE_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, sys, hashlib
          url = os.environ['SUPABASE_URL']; key = os.environ['SUPABASE_SERVICE_KEY']
          h = {'apikey': key, 'Authorization': f'Bearer {key}', 'Prefer': 'count=exact', 'Range': '0-0'}
          pasta = f"backups/{os.environ['BACKUP_DATE']}"
          man = json.load(open(f'{pasta}/_manifest.json', encoding='utf-8'))
          falhas, linhas = [], []
          for t, m in man['tabelas'].items():
              r = requests.get(f'{url}/rest/v1/{t}', headers=h, params={'select': '*'}, timeout=60)
              vivo = int(r.headers.get('content-range', '*/-1').split('/')[-1]) if r.status_code in (200, 206) else -1
              arq = json.load(open(f'{pasta}/{t}.json', encoding='utf-8'))
              sha = hashlib.sha256(open(f'{pasta}/{t}.json', 'rb').read()).hexdigest()
              ok = (vivo == m['linhas'] == len(arq)) and sha == m['sha256']
              linhas.append(f"{'OK  ' if ok else 'ERRO'} {t:22s} banco={vivo:>7} backup={len(arq):>7}")
              if not ok: falhas.append(t)
          rel = f"Verificação do backup {os.environ['BACKUP_DATE']} — {os.environ['TENANT_LABEL']}\n\n" + '\n'.join(linhas)
          print(rel)
          with open(f'{pasta}/_verificacao.txt', 'w', encoding='utf-8') as f: f.write(rel + '\n')
          if falhas:
              print('\nDIVERGENCIA em:', falhas); sys.exit(1)
          PYEOF

      - name: Compactar (nome com o tenant)
        run: |
          cd backups && zip -qr "../backup-${TENANT}-${BACKUP_DATE}.zip" "${BACKUP_DATE}/" && cd ..
          ls -lh "backup-${TENANT}-${BACKUP_DATE}.zip"
          echo "ZIP_SIZE=$(du -h backup-${TENANT}-${BACKUP_DATE}.zip | cut -f1)" >> "$GITHUB_ENV"
          echo "ZIP_BYTES=$(stat -c %s backup-${TENANT}-${BACKUP_DATE}.zip)" >> "$GITHUB_ENV"

      - name: Guardar no repositório privado crmeureka-backups
        env:
          SSH_KEY: ${{ secrets.CRMEUREKA_BACKUP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --quiet git@github.com:tucanoverde/crmeureka-backups.git /tmp/privado
          mkdir -p /tmp/privado/backups
          cp -r "backups/${BACKUP_DATE}" "/tmp/privado/backups/"
          python3 - << 'PYEOF'
          import os, shutil
          from datetime import datetime, timedelta
          lim = datetime.now() - timedelta(days=30)
          for d in os.listdir('/tmp/privado/backups'):
              try:
                  if datetime.strptime(d, '%Y-%m-%d') < lim:
                      shutil.rmtree(os.path.join('/tmp/privado/backups', d)); print('Removido (30d+):', d)
              except ValueError:
                  pass
          PYEOF
          echo "REPO_BYTES=$(du -sb /tmp/privado/backups | cut -f1)" >> "$GITHUB_ENV"
          cd /tmp/privado
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -q -m "backup CRM EUREKA ${BACKUP_DATE}"
          git push --quiet
          echo "Guardado em tucanoverde/crmeureka-backups (privado)."

      - name: Medir capacidade (banco, repositório, ZIP)
        env:
          SUPABASE_URL: ${{ secrets.CRMEUREKA_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.CRMEUREKA_SUPABASE_SERVICE_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, requests
          url = os.environ['SUPABASE_URL']; key = os.environ['SUPABASE_SERVICE_KEY']
          r = requests.post(f'{url}/rest/v1/rpc/capacidade', headers={'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}, json={}, timeout=60)
          cap = r.json() if r.status_code == 200 else {}
          MB = 1024 * 1024
          banco = cap.get('banco_bytes', 0) / MB; hist = cap.get('historico_bytes', 0) / MB
          zipb = int(os.environ.get('ZIP_BYTES', '0') or 0) / MB; repo = int(os.environ.get('REPO_BYTES', '0') or 0) / MB
          LIM_BANCO, LIM_REPO, LIM_ZIP = 8 * 1024, 1024, 20   # MB: plano Pro 8 GB; repositório GitHub 1 GB; anexo de e-mail 20 MB
          itens = [('Banco de dados', banco, LIM_BANCO), ('Repositório de backups (30 dias)', repo, LIM_REPO), ('ZIP de hoje', zipb, LIM_ZIP)]
          linhas, alerta = [], False
          for nome, uso, lim in itens:
              pct = 100 * uso / lim if lim else 0
              if pct >= 70: alerta = True
              nivel = 'ALERTA' if pct >= 70 else ('atencao' if pct >= 50 else 'ok')
              linhas.append(f'  {nome}: {uso:,.1f} MB de {lim:,.0f} MB ({pct:.1f}%) - {nivel}'.replace(',', '.'))
          linhas.append(f'  Histórico de alterações: {hist:,.1f} MB, {cap.get("linhas_historico", "?")} linhas · municípios: {cap.get("linhas_municipios", "?")} · usuários: {cap.get("usuarios", "?")}'.replace(',', '.'))
          txt = 'Capacidade (medida hoje; alerta a partir de 70% do limite):\n' + '\n'.join(linhas)
          print(txt)
          # variação: compara com a última medição guardada (só ela, sobrescrita a cada dia)
          import json, datetime as _dt
          HP = '/tmp/privado/capacidade_ultima.json'
          try: U = json.load(open(HP, encoding='utf-8'))
          except Exception: U = {}
          hoje = os.environ.get('BACKUP_DATE') or _dt.date.today().isoformat()
          ant_d = U.get('data') if U.get('data') and U.get('data') != hoje else U.get('data_anterior')
          ANT = U.get('valores', {}) if U.get('data') != hoje else U.get('valores_anteriores', {})
          novo_U = {'data': hoje, 'valores': {n: round(u, 3) for n, u, _ in itens}}
          try: novo_U['valores']['_alteracoes'] = int(cap.get('linhas_historico'))
          except Exception: pass
          if U.get('data') == hoje: novo_U.update(data_anterior=U.get('data_anterior'), valores_anteriores=U.get('valores_anteriores', {}))
          else: novo_U.update(data_anterior=U.get('data'), valores_anteriores=U.get('valores', {}))
          json.dump(novo_U, open(HP, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          # versão HTML com semáforo (verde < 50%, amarelo 50-70%, vermelho >= 70%)
          def sinal(pct):
              if pct >= 70: return ('#d93025', 'Alerta', '#fce8e6')
              if pct >= 50: return ('#f9ab00', 'Atenção', '#fef7e0')
              return ('#1e8e3e', 'OK', '#e6f4ea')
          def br(v, d=1): return f'{v:,.{d}f}'.replace(',', 'X').replace('.', ',').replace('X', '.')
          def tam(v): return (br(v/1024) + ' GB') if v >= 1024 else (br(v) + ' MB')
          td = 'padding:10px 12px;border-bottom:1px solid #eee;'
          def var(nome, uso):
              if nome not in ANT: return '<span style="color:#999;">—</span>'
              dlt = uso - ANT[nome]
              if abs(dlt) < 0.05: return '<span style="color:#666;">= 0 MB</span>'
              seta, cor = ('▲', '#c5221f') if dlt > 0 else ('▼', '#1e8e3e')
              return f'<span style="color:{cor};font-weight:bold;">{seta} {tam(abs(dlt))}</span>'
          lin = ''
          for nome, uso, lim in itens:
              pct = 100 * uso / lim if lim else 0
              cor, rot, fundo = sinal(pct)
              barra = f'<div style="background:#eee;border-radius:4px;height:8px;width:140px;"><div style="background:{cor};height:8px;border-radius:4px;width:{max(2, min(pct, 100) * 1.4):.0f}px;"></div></div>'
              lin += (f'<tr><td style="{td}"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:{cor};vertical-align:middle;margin-right:8px;"></span>{nome}</td>'
                      f'<td style="{td}text-align:right;">{tam(uso)}</td><td style="{td}text-align:right;">{tam(lim)}</td>'
                      f'<td style="{td}">{barra}<div style="font-size:12px;color:#555;margin-top:3px;">{br(pct)}%</div></td>'
                      f'<td style="{td}"><span style="background:{fundo};color:{cor};font-weight:bold;padding:3px 10px;border-radius:10px;font-size:12px;">{rot}</span></td>'
                      f'<td style="{td}text-align:right;white-space:nowrap;">{var(nome, uso)}</td></tr>')
          try: alt_hoje = int(cap.get('linhas_historico'))
          except Exception: alt_hoje = None
          alt_ant = ANT.get('_alteracoes')
          if alt_hoje is None or alt_ant is None: alt_var = '<span style="color:#999;">—</span>'
          elif alt_hoje > alt_ant: alt_var = f'<span style="color:#1a73e8;font-weight:bold;">▲ {alt_hoje - alt_ant:,} alterações</span>'.replace(',', '.')
          elif alt_hoje < alt_ant: alt_var = f'<span style="color:#c5221f;font-weight:bold;">▼ {alt_ant - alt_hoje:,} linhas</span>'.replace(',', '.')
          else: alt_var = '<span style="color:#666;">= nenhuma alteração</span>'
          uso_alt = (f'{alt_hoje:,}'.replace(',', '.') + ' linhas') if alt_hoje is not None else '?'
          lin += (f'<tr style="background:#f6f8fc;"><td style="{td}"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#1a73e8;vertical-align:middle;margin-right:8px;"></span><b>Alterações no CRM</b></td>'
                  f'<td style="{td}text-align:right;">{uso_alt}</td><td style="{td}text-align:right;color:#999;">—</td>'
                  f'<td style="{td}font-size:12px;color:#555;" colspan="2">Campos alterados pelos usuários (histórico)</td>'
                  f'<td style="{td}text-align:right;white-space:nowrap;">{alt_var}</td></tr>')
          geral = sinal(max((100 * u / l if l else 0) for _, u, l in itens))
          th = 'padding:10px 12px;'
          html = (f'<div style="font-family:Arial,Helvetica,sans-serif;color:#222;font-size:14px;">'
                  f'<p style="margin:0 0 12px;"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:{geral[0]};vertical-align:middle;margin-right:8px;"></span><b>Situação geral: {geral[1]}</b> <span style="color:#666;">(uso interno Tucano Verde)</span></p>'
                  f'<table style="border-collapse:collapse;min-width:620px;"><thead><tr style="background:#233E94;color:#fff;text-align:left;">'
                  f'<th style="{th}">Recurso</th><th style="{th}text-align:right;">Uso</th><th style="{th}text-align:right;">Limite</th><th style="{th}">Ocupação</th><th style="{th}">Sinal</th><th style="{th}text-align:right;">Variação</th></tr></thead><tbody>{lin}</tbody></table>'
                  f'<p style="margin:12px 0 4px;color:#555;font-size:13px;">Histórico de alterações: {br(hist)} MB, {cap.get("linhas_historico", "?")} linhas · Registros: {cap.get("linhas_municipios", "?")} · Usuários: {cap.get("usuarios", "?")}</p>'
                  f'<p style="margin:4px 0;color:#555;font-size:13px;">Variação: diferença desde a medição de {(_dt.date.fromisoformat(ant_d).strftime("%d/%m") if ant_d else "—")} (▲ cresceu, ▼ diminuiu).</p>'
                  f'<p style="margin:4px 0;color:#555;font-size:13px;">Legenda: <span style="color:#1e8e3e;">●</span> abaixo de 50% · <span style="color:#f9ab00;">●</span> de 50% a 70% · <span style="color:#d93025;">●</span> a partir de 70% (o assunto ganha ⚠️ ALERTA)</p>'
                  f'<p style="margin:4px 0;color:#888;font-size:12px;">Log: https://github.com/{os.environ.get("GITHUB_REPOSITORY", "")}/actions/runs/{os.environ.get("GITHUB_RUN_ID", "")}</p></div>')
          open('/tmp/capacidade.html', 'w', encoding='utf-8').write(html)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CAP_TXT<<CAPEOF\n' + txt + '\nCAPEOF\n')
              f.write('ALERTA=' + ('1' if alerta else '0') + '\n')
              f.write('CAP_ASSUNTO=' + ('⚠️ ALERTA ' if alerta else '') + '\n')
          PYEOF

      - name: Guardar histórico de capacidade
        run: |
          cd /tmp/privado
          git add capacidade_ultima.json
          git diff --staged --quiet || git commit -q -m "capacidade CRM EUREKA ${BACKUP_DATE}"
          git push --quiet || echo 'aviso: histórico de capacidade não foi enviado'

      - name: Enviar backup por e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Backup CRM EUREKA — ${{ env.BACKUP_DATE }}"
          to: ${{ secrets.CRMEUREKA_MAIL_TO }}
          from: "CRM Eureka <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Backup automático do CRM EUREKA (crmeureka.tucanoverde.com) para ${{ env.BACKUP_DATE }}.

            Este é o CRM do cliente Eureka — NÃO é o backup do CRM Redesa.

            Anexo: backup-crmeureka-${{ env.BACKUP_DATE }}.zip (${{ env.ZIP_SIZE }})
            Tabelas: municipios, municipios_historico, pipeline_tracking, indicadores_externos,
            perfis, fontes_dados, reuniao_semanal, configuracoes, atividades, colecoes, anexos.
            Verificação diária contra o banco: OK (todas as tabelas conferidas).

            ---
            Gerado automaticamente todo dia às 03:30 (Brasília). Em caso de problema, fale com o César.
          attachments: backup-crmeureka-${{ env.BACKUP_DATE }}.zip

      - name: Capacidade — e-mail diário só para o César
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ env.CAP_ASSUNTO }}Capacidade CRM EUREKA — ${{ env.BACKUP_DATE }}"
          to: cesaogolgpt@gmail.com
          from: "CRM Eureka <${{ secrets.MAIL_USERNAME }}>"
          html_body: file:///tmp/capacidade.html
          body: |
            Medição de hoje (uso interno Tucano Verde; o assunto ganha ALERTA a partir de 70% do limite):

            ${{ env.CAP_TXT }}

            Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Avisar o César se falhou
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ FALHOU o backup do CRM EUREKA — ${{ env.BACKUP_DATE }}"
          to: cesaogolgpt@gmail.com
          from: "CRM Eureka <${{ secrets.MAIL_USERNAME }}>"
          body: |
            O backup (ou a verificação diária) do CRM EUREKA (crmeureka.tucanoverde.com) FALHOU em ${{ env.BACKUP_DATE }}.
            Nenhum e-mail de backup foi enviado ao cliente hoje.
            Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
