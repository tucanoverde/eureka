name: Backup Diário Supabase

on:
  schedule:
    - cron: '0 6 * * *'  # Todo dia às 06:00 UTC (03:00 Brasília)
  workflow_dispatch:       # Permite rodar manualmente

permissions:
  contents: write          # garante que o git push do bot funcione

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Definir data do backup
        id: data
        run: echo "BACKUP_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Exportar backup do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 << 'EOF'
          import requests, json, os, sys
          from datetime import datetime

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_KEY']
          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Content-Type': 'application/json'
          }

          tabelas = [
              'municipios',
              'municipios_historico',
              'pipeline_tracking',
              'indicadores_externos',
              'perfis',
              'fontes_dados',
              'reuniao_semanal',
              'configuracoes',
              'atividades',
          ]

          data = os.environ['BACKUP_DATE']
          os.makedirs(f'backups/{data}', exist_ok=True)
          resumo = []

          for tabela in tabelas:
              print(f'Exportando {tabela}...')
              all_rows = []
              offset = 0
              limit = 1000

              while True:
                  r = requests.get(
                      f'{url}/rest/v1/{tabela}',
                      headers={**headers, 'Range': f'{offset}-{offset+limit-1}'},
                      params={'select': '*'}
                  )
                  if r.status_code not in [200, 206]:
                      # Erro HTTP (chave revogada, tabela inexistente etc.) NÃO pode
                      # virar backup vazio silencioso: aborta o job sem commit/email.
                      print(f'  ERRO {r.status_code} em {tabela}: {r.text[:200]}')
                      sys.exit(1)
                  rows = r.json()
                  if not rows:
                      break
                  all_rows.extend(rows)
                  if len(rows) < limit:
                      break
                  offset += limit

              with open(f'backups/{data}/{tabela}.json', 'w', encoding='utf-8') as f:
                  json.dump(all_rows, f, ensure_ascii=False, indent=2, default=str)
              print(f'  {len(all_rows)} registros salvos')
              resumo.append(f'- {tabela}: {len(all_rows)} registros')

              if tabela == 'municipios' and len(all_rows) == 0:
                  # A base de municípios nunca é vazia em produção (TAM ~5.572).
                  # Zero registros aqui = credencial/URL errada, não banco vazio.
                  print('ERRO: municipios retornou 0 registros — abortando backup.')
                  sys.exit(1)

          with open(f'backups/{data}/_resumo.txt', 'w', encoding='utf-8') as f:
              f.write(f'Backup CRM Eureka — {data}\n\n')
              f.write('\n'.join(resumo))
              f.write(f'\n\nTotal de tabelas: {len(tabelas)}\n')

          print(f'Backup completo: {data}')
          EOF

      - name: Compactar pasta do dia em ZIP
        id: zip
        run: |
          cd backups
          zip -r "../backup-eureka-${BACKUP_DATE}.zip" "${BACKUP_DATE}/"
          cd ..
          ls -lh "backup-eureka-${BACKUP_DATE}.zip"
          # Tamanho amigável e total de registros, pro corpo do email
          echo "ZIP_SIZE=$(du -h backup-eureka-${BACKUP_DATE}.zip | cut -f1)" >> "$GITHUB_ENV"
          echo "RESUMO_PATH=backups/${BACKUP_DATE}/_resumo.txt" >> "$GITHUB_ENV"

      - name: Enviar backup por email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Backup CRM Eureka — ${{ env.BACKUP_DATE }}"
          to: mauricio@redesa.co
          from: "CRM Eureka <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Backup automático do CRM Eureka para ${{ env.BACKUP_DATE }}.

            Anexo: backup-eureka-${{ env.BACKUP_DATE }}.zip (${{ env.ZIP_SIZE }})

            Tabelas inclusas:
            • municipios
            • municipios_historico
            • pipeline_tracking
            • indicadores_externos
            • perfis
            • fontes_dados
            • reuniao_semanal
            • configuracoes
            • atividades

            Backup também disponível no GitHub:
            https://github.com/tucanoverde/eureka/tree/main/backups/${{ env.BACKUP_DATE }}

            ---
            Este email é gerado automaticamente todo dia às 03:00 (Brasília).
            Em caso de problema, fale com Cesar.
          attachments: backup-eureka-${{ env.BACKUP_DATE }}.zip

      # Os dados do CRM (perfis com e-mail/telefone, pipeline comercial) NAO
      # podem ser gravados aqui: este repositorio e PUBLICO porque o GitHub
      # Pages so serve o CRM de graca assim. Por isso o backup vai para o
      # repositorio PRIVADO tucanoverde/eureka-backups, via deploy key.
      - name: Guardar backup no repositório privado
        env:
          SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --quiet git@github.com:tucanoverde/eureka-backups.git /tmp/privado
          mkdir -p /tmp/privado/backups
          cp -r "backups/${BACKUP_DATE}" "/tmp/privado/backups/"

          # Retencao de 30 dias, agora aplicada no repositorio privado
          python3 - <<'PY'
          import os, shutil
          from datetime import datetime, timedelta
          limite = datetime.now() - timedelta(days=30)
          pasta = '/tmp/privado/backups'
          for d in os.listdir(pasta):
              try:
                  if datetime.strptime(d, '%Y-%m-%d') < limite:
                      shutil.rmtree(os.path.join(pasta, d))
                      print(f'Removido (30d+): {d}')
              except ValueError:
                  pass
          PY

          cd /tmp/privado
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -q -m "backup automático ${BACKUP_DATE}"
          git push --quiet
          echo "Backup guardado em tucanoverde/eureka-backups (privado)."

      # Sem isto, uma falha só aparece na aba Actions e passa semanas
      # despercebida — foi o que aconteceu entre abril e setembro/2026.
      - name: Avisar o Cesar se o backup falhou
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ FALHOU o backup do CRM Eureka — ${{ env.BACKUP_DATE }}"
          to: cesaogolgpt@gmail.com
          from: "CRM Eureka <${{ secrets.MAIL_USERNAME }}>"
          body: |
            O backup automático do CRM Eureka FALHOU em ${{ env.BACKUP_DATE }}.

            NENHUM e-mail de backup foi enviado ao Luis hoje.

            Ver o erro:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Causa mais comum: a chave do Supabase (secret SUPABASE_SERVICE_KEY)
            venceu ou foi trocada pela chave errada (publishable no lugar da secreta).

            Como corrigir em 1 comando, na pasta C:\Users\Cesar\eureka:
              powershell -ExecutionPolicy Bypass -File ops\atualizar-chave-backup.ps1
